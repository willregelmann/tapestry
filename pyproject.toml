[project]
name = "tapestry"
version = "0.0.0"
description = "Long-term memory for AI agents: memory that knows it can be wrong."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."hermes_agent.memory_providers"]
tapestry = "tapestry.hosts.hermes:TapestryProvider"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tapestry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
