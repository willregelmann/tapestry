# Tapestry server behind Caddy, with a nightly backup of every mind.
#   TAPESTRY_DOMAIN=memory.example.org docker compose -f deploy/compose.yaml up -d
#   docker compose -f deploy/compose.yaml exec tapestry tapestry server mind add will
#   docker compose -f deploy/compose.yaml exec tapestry tapestry server key add --mind will --agent claude-code --machine laptop
services:
  tapestry:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    volumes: [tapestry-data:/data]
    expose: ["8650"]
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: [TAPESTRY_DOMAIN]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data]
    depends_on: [tapestry]
  backup:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    user: "10001"
    volumes: [tapestry-data:/data, ./backups:/backups]
    entrypoint: ["python", "-m", "tapestry.backup", "--every", "86400", "--to", "/backups", "--keep", "14"]
volumes:
  tapestry-data:
  caddy-data:
