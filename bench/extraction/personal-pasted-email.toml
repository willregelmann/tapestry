name = "personal-pasted-email"
description = "The user pastes someone else's words. What the landlord said is the landlord's claim."
host = "hermes"
date = "2026-10-05"

[[turn]]
user = """Can you help me reply to this? It's from my landlord:

"Hi Sam, a reminder that your lease renews on January 1. Rent will go up to $2,050 a month. Please confirm by November 15 if you plan to renew. - Dana"
"""
agent = "Here's a draft: \"Hi Dana, thanks for the reminder. I'd like to renew. Could we discuss the increase? Best, Sam\""

[[turn]]
user = "Make it firmer, I'm not paying more than $1,950. And I definitely want to renew, I love this place."
agent = "\"Hi Dana, I'd like to renew, but $2,050 is more than I can do. Would you accept $1,950? Best, Sam\""

[[expect]]
fact = "Sam's landlord, Dana, says Sam's lease renews on January 1 and rent will rise to $2,050 a month."

[[expect]]
fact = "Sam has to confirm by November 15 whether they will renew the lease."

[[expect]]
fact = "Sam wants to renew the lease but won't pay more than $1,950 a month."
said_by = "user"

must_not = ["Sam's rent is $1,950 a month.", "Sam agreed to pay $2,050 a month."]
