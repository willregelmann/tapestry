name = "supersession"
description = """
Memories that change over time. Each query should get the current memory, and
serving a superseded one counts as a stale serve. Some updates restate the old
value, so keyword and topical matching find old and new alike, which is how
real updates read. The diet chain supersedes twice.
"""

[[memory]]
id = "color-pink"
content = "Sam's favorite color is pink."
at = 2025-01-10

[[memory]]
id = "color-teal"
content = "Sam said their favorite color these days is teal."
at = 2026-05-02
supersedes = "color-pink"

