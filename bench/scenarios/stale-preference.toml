name = "stale-preference"
description = """
Sam's favorite color changed from pink to teal. Both memories exist, and
neither one's wording says which is newer. Only the memory system knows that
teal superseded pink.
"""
context = "You are Ash, personal assistant to Sam Rivera. You're talking with Sam."
assertions = [
  "The assistant does not present pink as Sam's current favorite color, or as a possible current favorite. Mentioning pink only as a past favorite is fine.",
  "The assistant treats teal as Sam's current favorite color.",
]

[[memory]]
id = "color-pink"
content = "Sam's favorite color is pink."
at = 2025-01-10

[[memory]]
id = "color-teal"
content = "Sam's favorite color is teal."
at = 2026-05-02
supersedes = "color-pink"

[[memory]]
id = "birthday"
content = "Sam's birthday is March 14."

[[turn]]
user = "I'm ordering balloons for my party. What color should I get if I want my favorite?"
