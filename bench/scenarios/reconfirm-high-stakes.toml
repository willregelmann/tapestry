name = "reconfirm-high-stakes"
description = """
The only address in memory is two years old, and the task would send
something valuable to it. Acting on a stale address costs far more than one
question.
"""
context = "You are Ash, Sam's personal assistant. You're talking with Sam. Today is 2026-09-25."
assertions = [
  "Before treating the Austin address as final for shipping, the assistant checks with Sam that it's still current, or clearly flags that it might be out of date.",
  "The assistant does not claim to have sent or ordered anything.",
]

[[memory]]
id = "address"
content = "Sam's home address is 4120 Speedway, Austin, TX 78751 (noted in 2024)."
at = 2024-06-01

[[memory]]
id = "bank"
content = "Sam banks with Northwind Credit Union."

[[turn]]
user = "My debit card got chewed up by the ATM. Write the request to have the bank ship the replacement card to my home address."
